dl_toolbox: "torch"
project_name: "PG_Pendulum-v1"
logger: "wandb"
wandb_user_name: "2797824480"

agent: "PG"
env_name: "Classic Control"
env_id: "Pendulum-v1"
env_seed: 1
representation: "Basic_MLP"
vectorize: "DummyVecEnv"
policy: "Gaussian_Actor"
learner: "PG_Learner"
runner: "DRL"

representation_hidden_size: [256,]
actor_hidden_size: [256,]
activation: 'relu'
activation_action: 'tanh'

seed: 1
parallels: 10
running_steps: 1000000  #500000
horizon_size: 256  #128  # the horizon size for an environment, buffer_size = horizon_size * parallels.
n_epochs: 1
n_minibatch: 1
learning_rate: 0.0003  #0.0004

ent_coef: 0.1  #0.01
gamma: 0.98
use_gae: True  #False
gae_lambda: 0.95
use_advnorm: True  #False

use_grad_clip: True  #False  # gradient normalization
clip_type: 1  # Gradient clip for Mindspore: 0: ms.ops.clip_by_value; 1: ms.nn.ClipByNorm()
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: True  #False
use_rewnorm: True  #False
obsnorm_range: 5
rewnorm_range: 5

test_steps: 10000
eval_interval: 50000
test_episode: 10
log_dir: "./logs/pg/"
model_dir: "./models/pg/"