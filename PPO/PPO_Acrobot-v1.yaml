dl_toolbox: "torch"
project_name: "PPO_Acrobot-v1"
logger: "wandb"
wandb_user_name: "2797824480"

agent: "PPO"  # Choice: PPO, PPO_KL
env_name: "Classic Control"
env_id: "Acrobot-v1"
env_seed: 1  # The random seed of the environment.
vectorize: "DummyVecEnv"
representation: "Basic_MLP"
policy: "Categorical_AC"
learner: "PPO_Learner"
runner: "DRL"

representation_hidden_size: [128,]
actor_hidden_size: [128,]
critic_hidden_size: [128,]
activation: 'relu'

seed: 1
parallels: 32  #10
running_steps: 3000000  #1000000  #500000
horizon_size: 500  #256  # the horizon size for an environment, buffer_size = horizon_size * parallels.
n_epochs: 8  #4  #8
n_minibatch: 8  #4  #8
learning_rate: 0.0003  #0.0004

vf_coef: 0.5  #0.25
ent_coef: 0.02  #0.05  #0.01
target_kl: 0.25  # for PPO_KL agent
kl_coef: 1.0  # for PPO_KL agent
clip_range: 0.2  # for PPO agent
gamma: 0.99  #0.98
use_gae: True
gae_lambda: 0.95
use_advnorm: True

use_grad_clip: True  # gradient normalization
clip_type: 1  # Gradient clip for Mindspore: 0: ms.ops.clip_by_value; 1: ms.nn.ClipByNorm()
grad_clip_norm: 0.5
use_actions_mask: False
use_obsnorm: True  # Whether to use observation normalization trick.
use_rewnorm: False  #True  # Whether to use reward normalization trick.
obsnorm_range: 5
rewnorm_range: 5

eval_interval: 50000
test_episode: 10
log_dir: "logs/ppo/"
model_dir: "models/ppo/"